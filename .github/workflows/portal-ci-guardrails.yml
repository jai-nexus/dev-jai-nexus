name: portal_ci_guardrails

on:
  workflow_dispatch:

  # REQUIRED CHECKS CANNOT BE PATH-BASED.
  # So run on every PR to avoid "Expected — Waiting..." blocks.
  pull_request:

  # Keep push scoped if you want (optional)
  push:
    branches: ["main"]
    paths:
      - "portal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/portal-ci-guardrails.yml"

permissions:
  contents: read

concurrency:
  group: dev-jai-nexus-portal-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal_guardrails:
    name: portal_guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prisma -d prisma"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=public
      DIRECT_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm (Corepack)
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
          pnpm -v

      - name: Get pnpm store path
        shell: bash
        run: |
          set -euo pipefail
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Guardrail - role guardrails policy regressions
        run: node --test portal/scripts/role-guardrails-policy.test.cjs

      - name: Guardrail - required control-plane test runner regressions
        run: node --test portal/scripts/run-required-control-plane-tests.test.mjs

      - name: Guardrail - required control-plane test manifest check
        run: node portal/scripts/run-required-control-plane-tests.mjs --check

      - name: Guardrail - forbid generated Prisma imports
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./portal/scripts/check-forbidden-prisma-imports.ps1 -Root "portal/src"

      - name: Guardrail - Prisma validate
        shell: bash
        working-directory: portal
        run: |
          set -euo pipefail
          pnpm exec prisma validate

      # Q4M11Y26-P2:A2 advisory A-1, enforced by A3-G.
      - name: Guardrail - offline Prisma wrapper regressions
        run: node --test portal/scripts/prisma-offline.test.mjs

      - name: Guardrail - offline Prisma validate
        run: node portal/scripts/prisma-offline.mjs validate

      # Q4M11Y26-P2:A3-C: the remaining Layer 2 provider paths stay locked at
      # USD 0.00 (advisory V-1a wave planner, V-1b motion-factory).
      - name: Guardrail - wave planner spend lock
        run: pnpm -C portal exec tsx src/lib/waves/agentPlanner.test.ts

      - name: Guardrail - motion-factory spend lock
        run: node --test portal/scripts/motion-factory.test.mjs

      # Q4M11Y26-P2:A3-D: runtime slot dispatch (advisory V-1c) locked at USD 0.00.
      - name: Guardrail - runtime slot dispatch spend lock
        run: pnpm -C portal exec tsx ../runtime/slotDispatch.test.ts

      - name: Guardrail - Type check
        shell: bash
        working-directory: portal
        run: |
          set -euo pipefail
          pnpm exec tsc --noEmit

      - name: CI-B - governing Motion validation
        run: |
          node portal/scripts/validate-motion.mjs --motion .nexus/motions/motion-0248/motion.yaml
          node portal/scripts/validate-sandbox-fixtures.mjs

      - name: CI-B - Motion snapshot check
        run: node portal/scripts/build-motion-snapshot.mjs --check

      - name: CI-B - Motion snapshot regressions
        run: node --test portal/scripts/build-motion-snapshot.test.mjs

      - name: CI-B - Package Format 2 validation
        env:
          COMPARISON_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="$COMPARISON_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            base="$(git rev-parse HEAD^1)"
          fi
          node portal/scripts/validate-package-format-2.mjs --base-sha "$base"

      - name: CI-B - Package Format 2 regressions
        run: node --test portal/scripts/validate-package-format-2.test.mjs

      # Kept from the previous loop, independent of the manifest: if the local
      # operating loop source exists, its test must exist and stay pinned.
      - name: Guardrail - local operating loop test pairing
        shell: bash
        run: |
          set -euo pipefail
          source_file="portal/src/lib/controlPlane/motionKernel/local-operating-loop.ts"
          test_file="portal/src/lib/controlPlane/motionKernel/local-operating-loop.test.ts"
          if [[ -f "$source_file" ]]; then
            [[ -f "$test_file" ]] || { echo "Required test missing: $source_file exists but $test_file does not."; exit 1; }
            grep -Fq '"motionKernel/local-operating-loop.test.ts"' portal/scripts/control-plane-required-tests-v0.json \
              || { echo "Required test not pinned in control-plane-required-tests-v0.json: $test_file"; exit 1; }
          fi

      # Replaces the ad-hoc discovery loop: --run re-checks the pinned >= 32
      # manifest, then executes every discovered control-plane *.test.ts
      # (pinned or not) and fails on any missing, skipped, or failing test.
      - name: Guardrail - required control-plane behavioral tests
        run: node portal/scripts/run-required-control-plane-tests.mjs --run

      - name: Build portal
        shell: bash
        working-directory: portal
        run: |
          set -euo pipefail
          pnpm build
