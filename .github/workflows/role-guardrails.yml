name: role_guardrails

# Trigger stays `pull_request`, never `pull_request_target`: this workflow
# never runs untrusted PR code with base-repo secrets or write tokens.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  role_guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node (22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Role guardrails policy regressions
        run: node --test portal/scripts/role-guardrails-policy.test.cjs

      # The rolemap that authorizes a PR comes from the PR's base SHA, never
      # from the PR's own working tree. A PR cannot grant itself permissions.
      - name: Enforce Role / Path / Evidence (trusted base policy)
        uses: actions/github-script@v7
        with:
          script: |
            const path = require("path");
            const policyLib = require(path.join(process.env.GITHUB_WORKSPACE, "portal/scripts/role-guardrails-policy.cjs"));

            function fail(message) {
              core.setFailed(message);
              throw new Error(message);
            }

            const pr = context.payload.pull_request;
            if (!pr) fail("Not a pull_request event.");
            const baseSha = pr.base && pr.base.sha;
            if (!/^[0-9a-f]{40}$/.test(baseSha || "")) fail("PR base SHA is missing or malformed.");

            let rawPolicy;
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "roles/rolemap.json",
                ref: baseSha,
                mediaType: { format: "raw" },
              });
              rawPolicy = policyLib.decodeContentsResponse(response.data);
            } catch (error) {
              fail(`Trusted base policy roles/rolemap.json is unreadable at ${baseSha}: ${error.message}`);
            }

            let policy;
            try {
              policy = policyLib.loadTrustedPolicy(rawPolicy);
            } catch (error) {
              fail(`${error.message} (ref ${baseSha})`);
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const result = policyLib.evaluatePullRequest({
              policy,
              body: pr.body || "",
              files: files.map((file) => ({ filename: file.filename, previous_filename: file.previous_filename })),
            });

            if (!result.ok) {
              for (const error of result.errors) core.error(error);
              fail(`Role guardrails failed (${result.errors.length} issue(s)) against base policy ${baseSha}:\n- ${result.errors.join("\n- ")}`);
            }

            core.info(`Role guardrails passed. role=${result.role} verifierBypass=${result.verifierBypass} evidenceRequired=${result.evidenceRequired} paths=${result.checkedPaths.length} policyRef=${baseSha}`);
